name: Publier Valmont

# Publication directe : les contrôles sont faits en local avant chaque push
# (python3 scripts/prepare-release.py puis node scripts/check.mjs).
# Une nouvelle version annule la publication encore en cours de la précédente.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
